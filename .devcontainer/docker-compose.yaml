services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      # AMQP broker port
      - "5672:5672"
      # Management Web UI (HTTP API)
      - "15672:15672"
      # Management Web UI over HTTPS
      - "15671:15671"
      # AMQP over TLS
      - "5671:5671"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - rabbitmq-net

volumes:
  rabbitmq-data:
  rabbitmq-logs:

networks:
  rabbitmq-net:
    driver: bridge
